name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend (lint · test · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisonke/backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sisonke/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://unused/unused
          JWT_SECRET: test-secret-value-for-ci-only-32chars

      - name: Build
        run: npm run build

  # ── Admin dashboard ──────────────────────────────────────────────────────────
  admin-dashboard:
    name: Admin dashboard (lint · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisonke-admin-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sisonke-admin-dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Flutter mobile app ───────────────────────────────────────────────────────
  flutter:
    name: Flutter (analyze · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sisonke

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  # ── Secret scan ──────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
